# Diagnostic-only pipeline. Throwaway branch — do not merge.
#
# Answers two questions about the agent VMs without running the suite:
#   1. What resolution do the agents actually run at, in the same session the
#      tests run in?
#   2. Is Set-DisplayResolution absent because the image switched from Server
#      Core to Desktop Experience, or present but failing to set a mode?
#
# No checkout, no install, no build. Finishes in seconds.

trigger: none
pr: none

jobs:
  - job: DiagnoseDisplay
    pool:
      name: 'Streamlabs Desktop Frontend'

    # Fan out so we sample several agents — if only some were re-imaged, that
    # alone would explain intermittent behaviour.
    strategy:
      parallel: 4

    steps:
      - checkout: none

      - powershell: |
          Write-Host "=== Agent ==="
          Write-Host "COMPUTERNAME : $env:COMPUTERNAME"
          Write-Host "SESSIONNAME  : $env:SESSIONNAME"
          Write-Host "USERNAME     : $env:USERNAME"

          Write-Host ""
          Write-Host "=== OS / edition ==="
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' |
            Select-Object ProductName, DisplayVersion, CurrentBuild, UBR, InstallationType |
            Format-List

          Write-Host "=== Display adapters / resolution ==="
          Get-CimInstance Win32_VideoController |
            Select-Object Name, VideoModeDescription, CurrentHorizontalResolution, CurrentVerticalResolution |
            Format-List

          Write-Host "=== Supported display modes ==="
          $modes = Get-CimInstance -ClassName CIM_VideoControllerResolution -ErrorAction SilentlyContinue |
            Select-Object HorizontalResolution, VerticalResolution |
            Sort-Object HorizontalResolution, VerticalResolution -Unique
          if ($modes) {
            $modes | Format-Table -AutoSize
            Write-Host "distinct modes :" $modes.Count
            $max = $modes | Sort-Object { $_.HorizontalResolution * $_.VerticalResolution } | Select-Object -Last 1
            Write-Host "largest mode   :" $max.HorizontalResolution "x" $max.VerticalResolution

            # 1920x1080 is what the pipeline used to ask for.
            # 1600x1000 is the app's default main-window size (main.js).
            $hasHd = $modes | Where-Object { $_.HorizontalResolution -ge 1920 -and $_.VerticalResolution -ge 1080 }
            $hasApp = $modes | Where-Object { $_.HorizontalResolution -ge 1600 -and $_.VerticalResolution -ge 1000 }
            if ($hasHd) {
              Write-Host "VERDICT: 1920x1080 IS available - re-enable Set-DisplayResolution"
            } elseif ($hasApp) {
              Write-Host "VERDICT: no 1920x1080, but a mode >= 1600x1000 exists - usable, set that instead"
            } else {
              Write-Host "VERDICT: NO mode >= 1600x1000 - scripting cannot fix this, the image needs a display driver"
            }
          } else {
            Write-Host "CIM_VideoControllerResolution returned nothing; falling back to Win32_VideoSettings"
            Get-CimInstance -ClassName Win32_VideoSettings -ErrorAction SilentlyContinue |
              Select-Object -First 40 Setting | Format-Table -AutoSize
          }

          Write-Host ""
          Write-Host "=== Display driver detail ==="
          Get-CimInstance Win32_VideoController |
            Select-Object Name, AdapterCompatibility, DriverVersion, DriverDate, InstalledDisplayDrivers, PNPDeviceID, Status |
            Format-List

          Write-Host "=== Set-DisplayResolution availability ==="
          $cmd = Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue
          if ($cmd) {
            $cmd | Select-Object Name, CommandType, Source | Format-List
            try {
              Get-DisplayResolution
            } catch {
              Write-Host "Get-DisplayResolution failed:"
              Write-Host $_.Exception.Message
            }
          } else {
            Write-Host "Set-DisplayResolution: NOT PRESENT (CommandNotFoundException)"
          }

          $setres = Test-Path "$env:SystemRoot\System32\setres.exe"
          $sdr = Test-Path "$env:SystemRoot\System32\SetDisplayResolution.exe"
          Write-Host "setres.exe present               : $setres"
          Write-Host "SetDisplayResolution.exe present : $sdr"

          Write-Host ""
          Write-Host "=== Toolchain ==="
          $nodeVersion = & node --version 2>&1
          Write-Host "node : $nodeVersion"
          $yarnVersion = & yarn --version 2>&1
          Write-Host "yarn : $yarnVersion"
        displayName: 'Diagnose display + OS'
        continueOnError: true
