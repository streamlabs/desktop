trigger:
  - staging
  - master

variables:
  CI: true

jobs:
  - job: Test
    pool:
      name: 'Streamlabs Desktop Frontend'

    workspace:
      clean: resources

    strategy:
      parallel: 4

    steps:
      - powershell: echo "IP for RDP connections:" $(Invoke-RestMethod ipinfo.io/ip)
        displayName: 'Get RDP address'

      # Set-DisplayResolution was removed on 2026-07-09 (e07d90059, f3e061001) because it
      # fails on the Server 2025 agents: the Amazon emulated VGA device falls back to the
      # Microsoft Basic Display Adapter, which enumerates only 800x600. Removing it stopped
      # the error but left the desktop at 800x600, and the suite ran there unnoticed for
      # six weeks. Assert instead of setting blindly, so this can't regress silently again.
      # See azure-test-blackout-verification.md.
      - powershell: |
          $sessionName = $env:SESSIONNAME
          Write-Host "session     : $sessionName"

          # The hardware adapter / console framebuffer.
          $c = Get-CimInstance Win32_VideoController | Select-Object -First 1
          $adapter = $c.Name
          $hwW = $c.CurrentHorizontalResolution
          $hwH = $c.CurrentVerticalResolution
          Write-Host "adapter     : $adapter"
          Write-Host "adapter res : $hwW x $hwH"

          # What a GUI process in THIS session actually sees, which is what Electron gets
          # when it creates the main window. Under RDP, or with a virtual display driver
          # active, this differs from the adapter reading - so assert on this one.
          $w = $null
          $h = $null
          try {
            Add-Type -AssemblyName System.Windows.Forms -ErrorAction Stop
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $w = $b.Width
            $h = $b.Height
            Write-Host "session res : $w x $h"
          } catch {
            Write-Host "session res : unavailable, falling back to the adapter reading"
            Write-Host $_.Exception.Message
            $w = $hwW
            $h = $hwH
          }

          if ($w -ne $hwW -or $h -ne $hwH) {
            Write-Host "##vso[task.logissue type=warning]Session resolution $w x $h differs from the adapter $hwW x $hwH. The agent is probably not on the console session. Tests will use the session value."
          }

          # The app's main window defaults to 1600x1000 (main.js). The e2e harness never
          # sets a window size, so tests inherit the desktop. Below this the window is
          # clamped toward its 800x600 minimum and UI tests fail misleadingly.
          $minW = 1600
          $minH = 1000

          if ($null -eq $w -or $null -eq $h -or $w -eq 0 -or $h -eq 0) {
            Write-Host "##vso[task.logissue type=error]Could not determine the screen resolution for this session."
            exit 1
          }
          if ($w -lt $minW -or $h -lt $minH) {
            Write-Host "##vso[task.logissue type=error]Desktop is $w x $h but the app's main window needs $minW x $minH. Tests would run in a clamped window and fail misleadingly. Fix the agent display driver rather than lowering this threshold."
            exit 1
          }
          Write-Host "OK - desktop is large enough for the app's default window."
        displayName: 'Assert usable screen resolution'

      - script: yarn install --immutable 2>&1
        displayName: 'Install Dependencies'

      - powershell: |
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $output = "$env:TEMP\vc_redist.x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Start-Process -FilePath $output -ArgumentList "/install", "/quiet", "/norestart" -Wait
        displayName: 'Install Visual Studio Redistributable DLLs'

      - script: node node_modules/electron/install.js
        displayName: 'Install Electron'

      - script: 'yarn ci:compile'
        displayName: 'Compile Assets'

      - script: 'yarn ci:tests'
        displayName: 'Run Tests'
        env:
          SLOBS_TEST_USER_POOL_TOKEN: $(userPoolToken)
          BROWSER_SOURCE_HARDWARE_ACCELERATION: 'OFF'
          SLOBS_TEST_STREAM_KEY: $(twitchStreamKey)
          SLOBS_TEST_RUN_CHUNK: "$(System.JobPositionInPhase)/$(System.TotalJobsInPhase)"

  - job: Check_eslint_and_strict_nulls_regression

    pool:
      name: 'Streamlabs Desktop Frontend'

    workspace:
      clean: resources

    steps:

      - powershell: echo "IP for RDP connections:" $(Invoke-RestMethod ipinfo.io/ip)
        displayName: 'Get RDP address'

      # - powershell: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      #   displayName: 'Setup Screen Resolution'

      - script: yarn install --immutable 2>&1
        displayName: 'Install Dependencies'

      - script: 'yarn eslint'
        displayName: 'ESLint'

      - script: 'yarn compile:strictnulls'
        displayName: 'Check regressions in files with strictNullChecks'

  - job: macOS

    pool:
      name: 'Streamlabs Desktop Frontend'
      vmImage: macOS-latest

    workspace:
      clean: resources

    steps:
      - script: yarn install --immutable --network-timeout 1000000 2>&1
        displayName: 'Install Dependencies'

      - script: node node_modules/electron/install.js
        displayName: 'Install Electron'

      - script: 'yarn eslint'
        displayName: 'ESLint'

      - script: 'yarn ci:compile'
        displayName: 'Compile Assets'
